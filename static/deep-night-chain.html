  <script>
    const shell = document.getElementById('vector-shell');
    const buttons = document.querySelectorAll('.trace-toolbar button');
    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.dataset.mode;
        shell.classList.remove('match-mode', 'compare-mode', 'vector-mode');
        shell.classList.add(`${mode}-mode`);
        buttons.forEach((item) => item.classList.toggle('active', item === button));
      });
    });
  </script>
